<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Gonzalez & Co. — Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0c; --ink-2:#141416; --ink-3:#1e1e21; --line:#2a2a2e;
    --paper:#f3f0e8; --muted:#8d8b86; --lime:#dcf74a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Montserrat,system-ui,sans-serif}
  .contours{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
  canvas#view.dragging{cursor:grabbing}

  .brand{position:fixed;top:20px;left:20px;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
  .mark{--d:46px;--k:calc(46/148);width:var(--d);height:var(--d);border-radius:50%;flex:none;
    background-repeat:no-repeat;
    background-size:calc(259px * var(--k)) calc(222px * var(--k));
    background-position:calc(-56px * var(--k)) calc(-6px * var(--k));}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.06em;line-height:1}
  .brand p{margin:6px 0 0;font-size:9.5px;letter-spacing:.38em;color:var(--muted);font-weight:500}

  .panel{position:fixed;left:20px;top:92px;z-index:5;display:flex;flex-direction:column;gap:4px;
    background:rgba(20,20,22,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px;width:230px}
  .panel h2{margin:2px 6px 8px;font-size:10px;letter-spacing:.24em;color:var(--muted);font-weight:600}
  .room{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:500;color:#dcd9d2}
  .room:hover,.room.on{background:var(--ink-3);color:var(--paper)}
  .room .dot{width:7px;height:7px;border-radius:50%;background:#3a3a3e;flex:none}
  .room.on .dot,.room:hover .dot{background:var(--lime)}
  .room .n{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  .top{position:fixed;top:20px;right:20px;z-index:5;display:flex;gap:8px;align-items:center}
  .chip{background:rgba(20,20,22,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:500;color:#dcd9d2;display:flex;gap:8px;align-items:center;white-space:nowrap}
  .chip b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
  .live{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(220,247,74,.15)}
  button.chip{cursor:pointer;font-family:inherit}
  button.chip:hover{border-color:#44444a;color:var(--paper)}
  button.chip.primary{background:var(--lime);color:var(--ink);border-color:var(--lime);font-weight:600}
  button.chip.primary.on{background:var(--paper);border-color:var(--paper)}
  .zoom{display:flex;flex-direction:column;gap:6px;position:fixed;right:20px;bottom:20px;z-index:5}
  .zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(20,20,22,.78);color:var(--paper);font-size:18px;cursor:pointer;font-family:inherit}
  .zoom button:hover{border-color:#44444a}

  .hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:4;font-size:11.5px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;pointer-events:none}
  .hint kbd{font-family:inherit;color:#cfccc5}

  .card{position:fixed;left:20px;bottom:20px;z-index:6;width:250px;background:rgba(20,20,22,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:none}
  .card.show{display:block}
  .card .who{display:flex;align-items:center;gap:10px}
  .card .av{width:34px;height:34px;border-radius:9px;background:var(--ink-3);image-rendering:pixelated}
  .card h3{margin:0;font-size:14px;font-weight:600}
  .card .role{font-size:11.5px;color:var(--muted);margin-top:3px}
  .card .st{margin-top:12px;font-size:12px;color:#dcd9d2;display:flex;gap:8px;align-items:center}
  .card .st i{width:6px;height:6px;border-radius:50%;background:var(--lime);flex:none}
  .card .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}

  @media (max-width:760px){
    .brand{top:14px;left:16px}
    .brand h1{font-size:15px}
    .panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:16px 16px 0 0;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:2px}
    .panel h2{display:none}
    .room{flex:none;padding:8px 10px;font-size:12px}
    .room .n{display:none}
    .top{top:auto;bottom:66px;right:16px;left:16px;justify-content:flex-end;flex-wrap:wrap}
    .top .chip.count,.top .chip.clock{display:none}
    .zoom{top:78px;right:16px;bottom:auto}
    .zoom button{width:34px;height:34px}
    .hint{display:none}
    .card{left:16px;right:16px;width:auto;bottom:118px}
  }
</style>
</head>

<div class="brand">

</div>

<nav class="panel" id="rooms"><h2>ANDAR 12 · SALAS</h2></nav>

<div class="top">
  <div class="chip clock"><span id="clock">--:--</span></div>
  <div class="chip count"><span class="live"></span><b id="count">0</b> no escritório</div>
  <button class="chip" id="labelsBtn">Nomes das salas</button>
  <button class="chip primary" id="meetBtn">Reunião geral</button>
</div>

<div class="zoom">
  <button id="zin" aria-label="Aproximar">+</button>
  <button id="zout" aria-label="Afastar">−</button>
  <button id="zfit" aria-label="Enquadrar" style="font-size:13px">⤢</button>
</div>

<div class="hint">Clique no chão para mover o <kbd>Talles</kbd> · clique numa cadeira para sentar · arraste para navegar · role para zoom</div>

</div>

const LIME = '#dcf74a', INK = '#0b0b0c', PAPER = '#f3f0e8';
const PIX = '"Pixelify Sans", monospace';

/* ---------- projeção ---------- */
const HW = 20, HH = 10, K = 1.25;          // meia-largura, meia-altura do tile, escala de altura
const GW = 30, GD = 22;                    // grade do andar (x por y)
const PAD = 60;
const OX = GD * HW + PAD, OY = 150;
const BW = (GW + GD) * HW + PAD * 2, BH = (GW + GD) * HH + OY + 70;
const P = (x, y, z = 0) => [OX + (x - y) * HW, OY + (x + y) * HH - z * K];

/* ---------- util ---------- */
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function shade(h, f){ const [r, g, b] = rgb(h), t = f < 0 ? 0 : 255, p = Math.abs(f); return `rgb(${Math.round(r + (t - r) * p)},${Math.round(g + (t - g) * p)},${Math.round(b + (t - b) * p)})`; }
function poly(c, pts, fill, stroke, lw = 1){
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}
function line(c, a, b, col, lw = 1){ c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.strokeStyle = col; c.lineWidth = lw; c.stroke(); }
const EDGE = 'rgba(0,0,0,.28)';

// caixa isométrica: faces topo, frente-esquerda (+y), frente-direita (+x)
function box(c, x, y, z, w, d, h, col, o = {}){
  const X = x + w, Y = y + d, Z = z + h;
  const st = o.stroke === undefined ? EDGE : o.stroke;
  if (o.alpha != null) c.globalAlpha = o.alpha;
  poly(c, [P(x, Y, z), P(X, Y, z), P(X, Y, Z), P(x, Y, Z)], o.left || shade(col, -.12), st);
  poly(c, [P(X, y, z), P(X, Y, z), P(X, Y, Z), P(X, y, Z)], o.right || shade(col, -.26), st);
  poly(c, [P(x, y, Z), P(X, y, Z), P(X, Y, Z), P(x, Y, Z)], o.top || col, st);
  c.globalAlpha = 1;
}
// cilindro (vasos, mesas redondas, pufes)
function cyl(c, cx, cy, r, z, h, col, top){
  const [bx, by] = P(cx, cy, z), [tx, ty] = P(cx, cy, z + h);
  const rx = r * HW * 1.414, ry = r * HH * 1.414;
  c.fillStyle = shade(col, -.2);
  c.beginPath(); c.ellipse(bx, by, rx, ry, 0, 0, Math.PI); c.lineTo(tx - rx, ty); c.ellipse(tx, ty, rx, ry, 0, Math.PI, 0, true); c.closePath(); c.fill();
  c.strokeStyle = EDGE; c.lineWidth = 1; c.stroke();
  c.fillStyle = top || col; c.beginPath(); c.ellipse(tx, ty, rx, ry, 0, 0, Math.PI * 2); c.fill(); c.stroke();
}
// desenhar sobre a face +y (plano y fixo): u → +x (20u = 1 tile), v → para baixo (px)
function onFaceY(c, x, y, z, fn){ const [sx, sy] = P(x, y, z); c.save(); c.setTransform(1, .5, 0, 1, sx, sy); fn(c); c.restore(); }
// desenhar sobre a face +x (plano x fixo): u → -y, origem no maior y
function onFaceX(c, x, y, z, fn){ const [sx, sy] = P(x, y, z); c.save(); c.setTransform(1, -.5, 0, 1, sx, sy); fn(c); c.restore(); }

/* ---------- buffers ---------- */
const buf = document.createElement('canvas'); buf.width = BW; buf.height = BH;
const b = buf.getContext('2d');
const bgc = document.createElement('canvas'); bgc.width = BW; bgc.height = BH;

function roomAt(x, y){ return ROOMS.find(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h); }

/* =========================================================
   ITENS (ordenados por profundidade)
   ========================================================= */
const items = [];
function bounds(o){
  o.minX = OX + (o.x - (o.y + o.d)) * HW;  o.maxX = OX + ((o.x + o.w) - o.y) * HW;
  o.minY = OY + (o.x + o.y) * HH - (o.z + o.h) * K; o.maxY = OY + (o.x + o.w + o.y + o.d) * HH - o.z * K;
}
function addItem(o){ o.z = o.z || 0; bounds(o); o._s = []; o._d = []; items.push(o); return o; }
function B(x, y, w, d, h, col, z = 0, o = {}){
  return addItem({ x, y, z, w, d, h, solid: !!o.solid, draw: c => { box(c, x, y, z, w, d, h, col, o); o.after && o.after(c); } });
}
const S = (x, y, w, d, h, col, z = 0, o = {}) => B(x, y, w, d, h, col, z, { ...o, solid: true });

/* ---------- pontos de uso (cadeiras, sofás...) ---------- */
const spots = [];
const DIR = { '+x':0, '+y':1, '-x':2, '-y':3 };
function spot(o){ o.occ = null; spots.push(o); return o; }

/* ---------- mobília ---------- */
function desk(x, y, w, d, top = '#d9bb8c', peds = []){
  S(x + .05, y + .1, .08, d - .2, 26, '#1d1d1f');
  S(x + w - .13, y + .1, .08, d - .2, 26, '#1d1d1f');
  for (const px of peds) S(px - .25, y + .15, .5, d - .3, 22, '#2a2a2c');
  S(x, y, w, d, 4, top, 26);
}
function chair(tx, ty, face, col = '#262628', o = {}){
  const cx = tx + .5, cy = ty + .5, bh = o.tall ? 19 : 14;
  B(cx - .22, cy - .22, .44, .44, 2, '#303033');
  B(cx - .04, cy - .04, .08, .08, 10, '#4a4a4e', 2);
  B(cx - .24, cy - .24, .48, .48, 4, col, 12, { top: shade(col, .12) });
  const bk = { '-y':[cx - .24, cy + .2, .48, .07], '+y':[cx - .24, cy - .27, .48, .07], '+x':[cx - .27, cy - .24, .07, .48], '-x':[cx + .2, cy - .24, .07, .48] }[face];
  B(bk[0], bk[1], bk[2], bk[3], bh, col, 16);
  return spot({ ax:tx, ay:ty, px:cx, py:cy, z:16, dir:DIR[face], sit:true, room:roomAt(tx, ty).id, ...o });
}
function stool(tx, ty, face, col = '#1d1d1f', o = {}){
  const cx = tx + .5, cy = ty + .5;
  B(cx - .03, cy - .03, .06, .06, 20, '#7a7a7e');
  addItem({ x:cx - .18, y:cy - .18, z:20, w:.36, d:.36, h:4, draw: c => cyl(c, cx, cy, .18, 20, 4, col, shade(col, .15)) });
  return spot({ ax:tx, ay:ty, px:cx, py:cy, z:24, dir:DIR[face], sit:true, room:roomAt(tx, ty).id, ...o });
}
function sofa(x, y, w, d, face, col, seats, approach, o = {}){
  const t = .26, a = .2, sh = 12, ah = 18, bh = 27, cush = shade(col, .1);
  let seat, arms, back, sp = [];
  if (face === '-x'){ seat = [x, y + a, w - t, d - 2 * a]; arms = [[x, y, w - t, a], [x, y + d - a, w - t, a]]; back = [x + w - t, y, t, d]; }
  if (face === '+x'){ seat = [x + t, y + a, w - t, d - 2 * a]; arms = [[x + t, y, w - t, a], [x + t, y + d - a, w - t, a]]; back = [x, y, t, d]; }
  if (face === '-y'){ seat = [x + a, y, w - 2 * a, d - t]; arms = [[x, y, a, d - t], [x + w - a, y, a, d - t]]; back = [x, y + d - t, w, t]; }
  if (face === '+y'){ seat = [x + a, y + t, w - 2 * a, d - t]; arms = [[x, y + t, a, d - t], [x + w - a, y + t, a, d - t]]; back = [x, y, w, t]; }
  S(seat[0], seat[1], seat[2], seat[3], sh, col, 0, { top: cush });
  for (const r of arms) S(r[0], r[1], r[2], r[3], ah, col);
  S(back[0], back[1], back[2], back[3], bh, col);
  const vertical = face === '-x' || face === '+x';
  for (let i = 0; i < seats; i++){
    const f = (i + .5) / seats;
    const px = vertical ? seat[0] + seat[2] / 2 : seat[0] + seat[2] * f;
    const py = vertical ? seat[1] + seat[3] * f : seat[1] + seat[3] / 2;
    sp.push(spot({ ax:approach[i][0], ay:approach[i][1], px, py, z:sh, dir:DIR[face], sit:true, room:roomAt(Math.floor(px), Math.floor(py)).id, tile:[Math.floor(px), Math.floor(py)], ...o }));
  }
  return sp;
}
function plant(tx, ty, size = 1, o = {}){
  const cx = o.cx ?? tx + .5, cy = o.cy ?? ty + .5, z = o.z || 0, r = .2 * size, ph = 12 * size, R = rng(tx * 97 + ty * 13 + size * 7);
  const leaves = [], n = Math.round(11 * size + 3);
  const greens = ['#2e6a3a', '#3b8446', '#52a04e', '#2a5c34'];
  for (let i = 0; i < n; i++){
    const a = (R() * 1.6 - .8) * Math.PI * (o.trail ? .5 : 1);
    const len = (o.trail ? 16 : 18 + R() * 20) * size;
    leaves.push({ dx: Math.sin(a) * len * (o.trail ? 1.4 : 1), dy: o.trail ? (6 + R() * 20) * size : -Math.cos(a) * len - 4 * size, w: (3 + R() * 3) * size, col: greens[i % 4] });
  }
  leaves.sort((p, q) => q.dy - p.dy);
  addItem({ x:cx - r, y:cy - r, z, w:2 * r, d:2 * r, h: ph + 34 * size, solid: !o.decor && z === 0, draw: c => {
    cyl(c, cx, cy, r, z, ph, o.pot || '#e9e6df', o.potTop || '#5b4636');
    const [px, py] = P(cx, cy, z + ph);
    for (const L of leaves){
      c.fillStyle = L.col; c.beginPath(); c.moveTo(px, py);
      c.quadraticCurveTo(px + L.dx * .5 - L.w, py + L.dy * .5 - L.w * .4, px + L.dx, py + L.dy);
      c.quadraticCurveTo(px + L.dx * .5 + L.w, py + L.dy * .5 + L.w * .4, px, py); c.fill();
    }
  }});
}
function imac(cx, y, z, kind, facing = '+y'){
  B(cx - .12, y, .24, .2, 1.5, '#cfd2d6', z, { stroke:'rgba(0,0,0,.18)' });
  B(cx - .04, y + .04, .08, .05, 7, '#c3c6ca', z + 1.5, { stroke:null });
  const sw = .74, sz = z + 6, sh = 17, sy = y + .1;
  addItem({ x:cx - sw / 2, y:sy, z:sz, w:sw, d:.06, h:sh, draw: c => {
    box(c, cx - sw / 2, sy, sz, sw, .06, sh, '#e2e4e7', { left: facing === '+y' ? '#e9ebee' : '#cfd2d6' });
    if (facing === '+y') onFaceY(c, cx - sw / 2 + .03, sy + .06, sz + sh - .8, cc => screenArt(cc, kind, (sw - .06) * HW, 15));
  }});
}
function screenArt(c, kind, W, H){
  const f = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  if (kind === 'design'){ f(0, 0, W, H, '#f1eee6'); c.fillStyle = LIME; c.beginPath(); c.arc(W / 2, H / 2, 5, 0, 7); c.fill(); f(W / 2 - 3, H / 2 - 1, 6, 2, INK); f(1, 1, 3, H - 2, '#2a2a2c'); return; }
  if (kind === 'edit'){ f(0, 0, W, H, '#15171b'); f(2, 1, W - 4, 7, '#3d6f8f'); f(2, 6, W - 4, 2, '#6a8f5a'); f(1, 9, 7, 1, LIME); f(5, 11, 8, 1, '#e08a4a'); f(2, 13, 10, 1, '#7aa7d8'); f(8, 9, 1, 6, '#fff'); return; }
  if (kind === 'social'){ f(0, 0, W, H, '#f6f4ef'); const cs = [LIME, '#1b1b1d', '#c9c3b6', '#e3a072', '#7fa3c0', '#1b1b1d', LIME, '#c9c3b6', '#2f2f33']; for (let i = 0; i < 9; i++) f(1 + (i % 3) * 4.2, 1 + Math.floor(i / 3) * 4.6, 3.6, 4, cs[i]); return; }
  if (kind === 'ads'){ f(0, 0, W, H, '#111418'); c.strokeStyle = LIME; c.lineWidth = 1.2; c.beginPath(); c.moveTo(1, H - 3); c.lineTo(4, H - 6); c.lineTo(7, H - 5); c.lineTo(10, H - 11); c.lineTo(W - 1, H - 13); c.stroke(); f(1, 1, 5, 1, '#9aa'); return; }
  if (kind === 'text'){ f(0, 0, W, H, '#fbfaf7'); for (let i = 0; i < 6; i++) f(2, 2 + i * 2, W - 4 - (i % 3) * 3, 1, '#9b9890'); return; }
  if (kind === 'motion'){ f(0, 0, W, H, '#1a1a1e'); c.strokeStyle = '#e0a3ff'; c.lineWidth = 1; c.beginPath(); c.moveTo(1, H - 2); c.bezierCurveTo(5, H - 2, 6, 2, W - 1, 2); c.stroke(); f(1, H - 3, 2, 2, LIME); f(W - 3, 1, 2, 2, LIME); return; }
  if (kind === 'fin'){ f(0, 0, W, H, '#fbfaf7'); for (let i = 0; i < 6; i++){ f(1, 1 + i * 2.3, W - 2, .6, '#d8d5ce'); f(W - 5, 1.7 + i * 2.3, 3, 1, i % 2 ? '#2f8f4e' : '#b94a3b'); } return; }
  if (kind === 'ceo'){ f(0, 0, W, H, '#121214'); f(1, 1, W - 2, 3, '#232327'); c.fillStyle = LIME; for (let i = 0; i < 5; i++) f(2 + i * 2, H - 2 - (i + 1) * 1.6, 1.4, (i + 1) * 1.6, i === 4 ? LIME : '#6d7a3a'); return; }
}

const WALLS = [
  ['y', 8, 0, 9, 'glass', [6]],      // chefe → corredor
  ['x', 9, 0, 8, 'solid', []],       // chefe | copa
  ['x', 11, 0, 3, 'solid', []],      // banheiro

  ['y', 11, 22, 30, 'glass', []],    // reunião frente
  ['y', 10, 0, 10, 'glass', [8]],    // jogos → corredor
  ['x', 10, 10, 22, 'glass', [17]],  // jogos | recepção
  ['y', 13, 20, 30, 'glass', [21]],  // financeiro → corredor
  ['x', 20, 13, 22, 'glass', [18]],  // financeiro | recepção
];
const IWH = 58; // altura das paredes internas
function wallSeg(axis, c, a, bnd, type){
  const t = type === 'glass' ? .05 : .08;
  const o = axis === 'y' ? { x:a, y:c - t, w:bnd - a, d:2 * t } : { x:c - t, y:a, w:2 * t, d:bnd - a };
  o.z = 0; o.h = IWH; o.wall = true;
  if (type === 'solid'){
    o.draw = cx => box(cx, o.x, o.y, 0, o.w, o.d, IWH, '#ece8e0', { top:'#3a3a3d', left:'#e7e2d9', right:'#d6d0c5' });
  } else {
    o.draw = cx => {
      box(cx, o.x, o.y, 0, o.w, o.d, IWH, '#cfe6e6', { alpha:.2, stroke:null, top:'#1d1d20' });
      const fr = '#1b1b1d';
      if (axis === 'y'){
        const Y = o.y + o.d;
        line(cx, P(a, Y, 0), P(bnd, Y, 0), fr, 1.5); line(cx, P(a, Y, IWH), P(bnd, Y, IWH), fr, 2);
        for (let i = a; i <= bnd + 1e-6; i++) line(cx, P(i, Y, 0), P(i, Y, IWH), fr, i === a || i === bnd ? 2 : 1);
        poly(cx, [P(a, o.y, IWH), P(bnd, o.y, IWH), P(bnd, Y, IWH), P(a, Y, IWH)], fr);
      } else {
        const X = o.x + o.w;
        line(cx, P(X, a, 0), P(X, bnd, 0), fr, 1.5); line(cx, P(X, a, IWH), P(X, bnd, IWH), fr, 2);
        for (let i = a; i <= bnd + 1e-6; i++) line(cx, P(X, i, 0), P(X, i, IWH), fr, i === a || i === bnd ? 2 : 1);
        poly(cx, [P(o.x, a, IWH), P(X, a, IWH), P(X, bnd, IWH), P(o.x, bnd, IWH)], fr);
      }
      // reflexo sutil
      cx.globalAlpha = .18;
      if (axis === 'y'){ const Y = o.y + o.d; for (let i = a; i < bnd; i++) poly(cx, [P(i + .2, Y, 8), P(i + .35, Y, 8), P(i + .75, Y, IWH - 6), P(i + .6, Y, IWH - 6)], '#ffffff'); }
      else { const X = o.x + o.w; for (let i = a; i < bnd; i++) poly(cx, [P(X, i + .8, 8), P(X, i + .65, 8), P(X, i + .25, IWH - 6), P(X, i + .4, IWH - 6)], '#ffffff'); }
      cx.globalAlpha = 1;
    };
  }
  addItem(o);
}
for (const [axis, c, a, bnd, type, doors] of WALLS){
  let s = a;
  for (const dr of [...doors].sort((p, q) => p - q)){ if (dr > s) wallSeg(axis, c, s, dr, type); s = dr + 1; }
  if (bnd > s) wallSeg(axis, c, s, bnd, type);
}

function floorCol(x, y){
  const alt = (x + y) % 2;
  if (x >= 9 && x < 11 && y < 3) return alt ? '#ecebe8' : '#e2e1dd';
  if (x < 9 && y < 8) return y % 2 ? '#b98e60' : '#b2875a';
  if (x >= 22 && y < 11) return alt ? '#bab4ab' : '#b6b0a7';
  return alt ? '#dbd6cd' : '#d5d0c6';
}
function rug(c, x, y, w, d, col, border){
  poly(c, [P(x, y), P(x + w, y), P(x + w, y + d), P(x, y + d)], col);
  if (border) poly(c, [P(x + .15, y + .15), P(x + w - .15, y + .15), P(x + w - .15, y + d - .15), P(x + .15, y + d - .15)], null, border, 1);
}

/* =========================================================
   GRADE DE CAMINHADA
   ========================================================= */
const blocked = new Uint8Array(GW * GD);
const edgeBlock = new Set();
const ek = (x1, y1, x2, y2) => (x1 < x2 || (x1 === x2 && y1 < y2)) ? `${x1},${y1}|${x2},${y2}` : `${x2},${y2}|${x1},${y1}`;
function buildGrid(){
  for (const it of items){ if (!it.solid) continue;
    for (let tx = Math.floor(it.x + .03); tx <= Math.floor(it.x + it.w - .03); tx++)
      for (let ty = Math.floor(it.y + .03); ty <= Math.floor(it.y + it.d - .03); ty++)
        if (tx >= 0 && ty >= 0 && tx < GW && ty < GD) blocked[ty * GW + tx] = 1;
  }
  for (const [axis, c, a, bnd, , doors] of WALLS) for (let i = a; i < bnd; i++){ if (doors.includes(i)) continue;
    if (axis === 'y') edgeBlock.add(ek(i, c - 1, i, c)); else edgeBlock.add(ek(c - 1, i, c, i)); }
}
const walk = (x, y) => x >= 0 && y >= 0 && x < GW && y < GD && !blocked[y * GW + x];
function findPath(sx, sy, tx, ty){
  if (sx === tx && sy === ty) return [];
  const prev = new Int32Array(GW * GD).fill(-1), q = [sy * GW + sx]; prev[q[0]] = q[0];
  for (let h = 0; h < q.length; h++){
    const cur = q[h], cx = cur % GW, cy = (cur / GW) | 0;
    if (cx === tx && cy === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
      const nx = cx + dx, ny = cy + dy, ni = ny * GW + nx;
      if (!(nx === tx && ny === ty) && !walk(nx, ny)) continue;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GD || prev[ni] !== -1 || edgeBlock.has(ek(cx, cy, nx, ny))) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  const t = ty * GW + tx; if (prev[t] === -1) return null;
  const path = []; for (let c = t; c !== sy * GW + sx; c = prev[c]) path.push([c % GW, (c / GW) | 0]);

function goTo(p, target){ // target: spot ou {tx,ty}

  for (const [x, y] of path) q.push([x + .5, y + .5]);
  if (target.ax != null) q.push([target.px, target.py]);

}

function update(dt){
  for (const p of people){
    if (p.say && (p.say.t -= dt) <= 0) p.say = null;
    if (p.moving){
      let step = 2.3 * dt;
      while (step > 0 && p.queue.length){
        const [tx, ty] = p.queue[0], dx = tx - p.x, dy = ty - p.y, dist = Math.hypot(dx, dy);
        if (dist > 1e-4){ p.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3); }
        if (dist <= step){ p.x = tx; p.y = ty; step -= dist; p.queue.shift(); }
        else { p.x += dx / dist * step; p.y += dy / dist * step; step = 0; }
      }
      p.stepT += dt;
      if (!p.queue.length) arrive(p);
    } else if (!p.player){
      p.timer -= dt; if (p.timer <= 0) decide(p);
    }
  }
  // conversa aleatória
  if (Math.random() < dt * .12){ const p = people[(Math.random() * people.length) | 0]; if (!p.say && !p.moving) say(p, LINES[p.id][(Math.random() * LINES[p.id].length) | 0]); }
}

/* =========================================================
   ORDENAÇÃO POR PROFUNDIDADE
   ========================================================= */
function behind(a, c){
  const e = 1e-3;
  if (a.x + a.w <= c.x + e) return true;  if (c.x + c.w <= a.x + e) return false;
  if (a.y + a.d <= c.y + e) return true;  if (c.y + c.d <= a.y + e) return false;
  if (a.z + a.h <= c.z + e) return true;  if (c.z + c.h <= a.z + e) return false;
  return (a.x + a.w / 2 + a.y + a.d / 2) < (c.x + c.w / 2 + c.y + c.d / 2);
}
const overlap = (a, c) => !(a.maxX <= c.minX || c.maxX <= a.minX || a.maxY <= c.minY || c.maxY <= a.minY);
function buildStaticDeps(){
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++){
    const a = items[i], c = items[j]; if (!overlap(a, c)) continue;
    if (behind(a, c)) c._s.push(a); else a._s.push(c);
  }
}
function order(dyn){
  for (const s of items){ s._d.length = 0; s._v = 0; }
  for (const d of dyn){ d._s = []; d._d = []; d._v = 0; bounds(d); }
  for (const d of dyn){
    for (const s of items) if (overlap(d, s)){ if (behind(d, s)) s._d.push(d); else d._d.push(s); }
    for (const e of dyn) if (e !== d && dyn.indexOf(e) > dyn.indexOf(d) && overlap(d, e)){ if (behind(d, e)) e._d.push(d); else d._d.push(e); }
  }
  const out = [];
  const visit = n => { if (n._v) return; n._v = 1; for (const m of n._s) visit(m); for (const m of n._d) visit(m); out.push(n); };
  for (const s of items) visit(s); for (const d of dyn) visit(d);
  return out;
}

  ctx.fillStyle = o.bg || 'rgba(14,14,16,.88)'; roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
  if (o.border){ ctx.strokeStyle = o.border; ctx.lineWidth = 1; ctx.stroke(); }
  if (o.dot){ ctx.fillStyle = LIME; ctx.beginPath(); ctx.arc(x + 12, y + h / 2, 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = o.color || PAPER; ctx.textBaseline = 'middle'; ctx.fillText(text, x + (o.dot ? 20 : 8), y + h / 2 + .5);
}
function bubble(p, text){
  const [bx, by] = P(p.x, p.y, p.z); const [sx, sy0] = toScr(bx, by - 58 + (p.sit ? 14 : 0));
  ctx.font = `600 12px ${PIX}`; const nameW = ctx.measureText(p.name + ': ').width;
  ctx.font = `400 12px ${PIX}`; const tw = ctx.measureText(text).width;
  const w = nameW + tw + 18, h = 24, x = Math.round(sx - w / 2), y = Math.round(sy0 - h - 8);
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
  roundRect(ctx, x, y, w, h, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx - 5, y + h); ctx.lineTo(sx, y + h + 6); ctx.lineTo(sx + 5, y + h); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(sx - 5, y + h); ctx.lineTo(sx, y + h + 6); ctx.lineTo(sx + 5, y + h); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.textBaseline = 'middle';
  ctx.font = `600 12px ${PIX}`; ctx.fillText(p.name + ':', x + 9, y + h / 2 + 1);
  ctx.font = `400 12px ${PIX}`; ctx.fillText(text, x + 9 + nameW, y + h / 2 + 1);
}

let last = performance.now(), clockT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  if (camAnim){ camAnim.t = Math.min(1, camAnim.t + dt * 2.2); const k = 1 - Math.pow(1 - camAnim.t, 3);
    for (const key of ['s', 'x', 'y']) cam[key] = camAnim.from[key] + (camAnim.to[key] - camAnim.from[key]) * k; if (camAnim.t >= 1) camAnim = null; }

  // --- mundo ---
  b.clearRect(0, 0, BW, BH);
  b.drawImage(bgc, 0, 0);
  const hr = pinnedRoom || hoverRoom;
  if (hr){ b.globalAlpha = .16; poly(b, [P(hr.x, hr.y), P(hr.x + hr.w, hr.y), P(hr.x + hr.w, hr.y + hr.h), P(hr.x, hr.y + hr.h)], LIME); b.globalAlpha = 1; }
  if (hoverTile && !hoverPerson){ const [tx, ty] = hoverTile; if (walk(tx, ty) || spotAtTile(tx, ty)) poly(b, [P(tx, ty), P(tx + 1, ty), P(tx + 1, ty + 1), P(tx, ty + 1)], 'rgba(255,255,255,.18)', 'rgba(20,20,22,.55)'); }
  if (marker && talles.moving){ const { tx, ty } = marker; poly(b, [P(tx + .15, ty + .15), P(tx + .85, ty + .15), P(tx + .85, ty + .85), P(tx + .15, ty + .85)], null, LIME, 1.5); }
  const dyn = people.map(p => ({ x:p.x - .18, y:p.y - .18, z:p.z, w:.36, d:.36, h:42, draw: c => drawPerson(c, p, now / 1000) }));
  for (const it of order(dyn)) it.draw(b);

  // --- tela ---
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  ctx.imageSmoothingEnabled = cam.s < 1;
  ctx.drawImage(buf, Math.round(cam.x), Math.round(cam.y), Math.round(BW * cam.s), Math.round(BH * cam.s));

  if (showLabels){
    for (const r of ROOMS){ if (r.hidden) continue;
      const [bx, by] = P(r.x + r.w / 2, r.y + r.h / 2, 0), [sx, sy] = toScr(bx, by);
      const on = hr === r;
      tag(r.name, sx, sy - 4, { dot:true, bold:on, size:12, bg: on ? 'rgba(14,14,16,.95)' : 'rgba(14,14,16,.72)' });
    }
  }
  // indicador do Talles
  { const [bx, by] = P(talles.x, talles.y, talles.z); const [sx, sy] = toScr(bx, by - 60 + (talles.sit ? 14 : 0)); const bob = Math.sin(now / 260) * 3;
    ctx.fillStyle = LIME; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx - 7, sy - 10 + bob); ctx.lineTo(sx + 7, sy - 10 + bob); ctx.lineTo(sx, sy - 1 + bob); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  for (const p of people) if (p.say) bubble(p, p.say.text);
  const hp = hoverPerson || null;
  if (hp && !hp.say){ const [bx, by] = P(hp.x, hp.y, hp.z); const [sx, sy] = toScr(bx, by - 56 + (hp.sit ? 14 : 0)); tag(`${hp.name} · ${hp.role}`, sx, sy - 6, { size:11.5, font:PIX, h:22 }); }
  if (hoverRoom && !hp){ const r = hoverRoom; if (r.sub && hoverTile){ /* subtítulo junto do mouse via label da sala */ } }

  // HUD de tempos em tempos
  clockT -= dt;
  if (clockT <= 0){
    clockT = .5;
    const d = new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    document.getElementById('count').textContent = people.length;
    const counts = {}; for (const p of people){ const r = roomAt(Math.floor(p.x), Math.floor(p.y)); const id = r && (r.id === 'wc' ? 'copa' : r.id); if (id) counts[id] = (counts[id] || 0) + 1; }
    document.querySelectorAll('[data-n]').forEach(el => el.textContent = counts[el.dataset.n] || 0);
    if (selected) document.getElementById('cardSt').textContent = statusOf(selected);
  }
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
buildGrid();
buildStaticDeps();
resize(); fit(false);
window.addEventListener('resize', () => { resize(); fit(false); });
const fontsReady = document.fonts ? Promise.race([document.fonts.load(`10px ${PIX}`), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontsReady.then(() => renderBG());
LOGO.onload = () => renderBG();
renderBG();
requestAnimationFrame(frame);
setTimeout(() => say(talles, 'Bem-vindos à Gonzalez & Co.!'), 900);
</script>
